<!DOCTYPE html>
<html>
<head>
<title>Semantic HTML Demo</title>
<meta charset="utf-8"/>
<meta name="description" content="Showing how to use semantic html for web page structure."/>
</head>


<body>
<header><h1>This is the header</h1></header>

<nav><p>This is where we can find our links</p></nav>

<section style="color: #688E26;">
<h2>This is a title related to content of this page</h2>
<article>
<h3>Title of article</h3>
<p>This paragraph goes with the article</p>
</article>

<article>
<h3>Title of second article</h3>
<p>This paragraph goes with the second article</p>
</article>
</section>

<aside>
<h4>Title for side section</h4>
<p>Item 1</p>
<p>Item 2</p>
<p>Item 3</p>
</aside>

<footer>
<p><em>Page by Ryan &copy; 2026</em></p>
</footer>

</body>
</html>
